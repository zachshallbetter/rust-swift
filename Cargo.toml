[workspace]
members = [
    "crates/rust-swift-ir",
    "crates/rust-swift-frontend",
    "crates/rust-swift-codegen",
    "crates/rust-swift-cli",
    "crates/rust-swift-qualification",
    "crates/rust-swift-mcp",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Zach Shallbetter <https://github.com/zachshallbetter>", "The Reflective Rust Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/zachshallbetter/rust-swift"
homepage = "https://github.com/zachshallbetter/rust-swift"
readme = "README.md"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
sha2 = "0.10"
clap = { version = "4.5", features = ["derive"] }
thiserror = "1.0"
reflective-rust-csg = { git = "https://github.com/zachshallbetter/reflective-rust", branch = "main" }
reflective-rust-protocol = { git = "https://github.com/zachshallbetter/reflective-rust", branch = "main" }
