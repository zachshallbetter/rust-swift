name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qualification:
    name: Build, Test, and Qualify
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check Rust Formatting
        run: cargo fmt --all --check

      - name: Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build Workspace Binaries
        run: cargo build --workspace

      - name: Run Workspace Tests
        run: cargo test --workspace

      - name: Run Differential Qualification Suite
        run: cargo run -p rust-swift-cli -- diff-test

      - name: Run Failure Injection & Mutation Qualification Suite
        run: cargo run -p rust-swift-cli -- eval

      - name: Run Differential Performance Benchmarking Suite
        run: cargo run -p rust-swift-cli -- bench

      - name: Validate Formal Bootstrap
        run: python3 scripts/validate-bootstrap.py

      - name: Validate Epistemic Proof Dossier (rust-swift-proof)
        run: |
          mkdir -p target/qualification
          cargo run -p rust-swift-cli -- proof examples/fsm_example.rs -o target/qualification/proof-receipt.json
          test -f target/qualification/proof-receipt.json

      - name: Validate Incremental CSG Delta Synchronizer (rust-swift-sync)
        run: |
          cargo run -p rust-swift-cli -- sync --input-dir examples/PluginDemoApp/Sources/PluginDemoApp --output-dir target/qualification/sync-ci
          test -f target/qualification/sync-ci/.rust-swift-sync-cache.json

      - name: Validate SPM Build Tool Plugin (rust-swift-spm-plugin)
        run: |
          cargo build
          cd examples/PluginDemoApp
          swift run

      - name: Validate App Store Connect & Notarization Pipeline
        run: |
          python3 scripts/asc-token.py --test
          ./scripts/apple-notarize.sh --help
          ./scripts/apple-notarize.sh --app target/debug/rust-swift --dry-run

