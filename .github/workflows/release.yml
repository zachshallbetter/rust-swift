name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            binary_name: rust-swift
          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: rust-swift
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: rust-swift

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI Binary
        run: cargo build --release -p rust-swift-cli --target ${{ matrix.target }}

      - name: Package Archive
        run: |
          ARCHIVE_DIR="rust-swift-${{ matrix.target }}"
          mkdir -p "$ARCHIVE_DIR"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "$ARCHIVE_DIR/"
          cp README.md LICENSE "$ARCHIVE_DIR/" 2>/dev/null || true
          tar -czvf "rust-swift-${{ matrix.target }}.tar.gz" "$ARCHIVE_DIR"
          shasum -a 256 "rust-swift-${{ matrix.target }}.tar.gz" > "rust-swift-${{ matrix.target }}.tar.gz.sha256"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            rust-swift-${{ matrix.target }}.tar.gz
            rust-swift-${{ matrix.target }}.tar.gz.sha256

  publish-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare Assets
        run: |
          mkdir -p dist
          find release-artifacts -type f \( -name "*.tar.gz" -o -name "*.sha256" \) -exec cp {} dist/ \;
          cd dist
          sha256sum * > SHA256SUMS.txt || true
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
