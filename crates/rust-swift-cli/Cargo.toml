[package]
name = "rust-swift-cli"
description = "Command-line interface for the rust-swift compiler"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rust-swift"
path = "src/main.rs"

[dependencies]
rust-swift-ir = { path = "../rust-swift-ir" }
rust-swift-frontend = { path = "../rust-swift-frontend" }
rust-swift-codegen = { path = "../rust-swift-codegen" }
rust-swift-qualification = { path = "../rust-swift-qualification" }
rust-swift-mcp = { path = "../rust-swift-mcp" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
