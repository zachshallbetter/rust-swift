description = "Model Context Protocol (MCP) server for the rust-swift compiler"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "rust-swift-mcp"
path = "src/main.rs"

[dependencies]
